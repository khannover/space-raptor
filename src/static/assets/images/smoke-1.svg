<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Smoke layers -->
  <defs>
    <radialGradient id="smokeGradient1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#dddddd;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#aaaaaa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main smoke cloud -->
  <circle cx="50" cy="50" r="40" fill="url(#smokeGradient1)">
    <animate attributeName="r" values="0;40" dur="0.8s" repeatCount="1" />
    <animate attributeName="opacity" values="0.9;0" dur="1.2s" repeatCount="1" />
  </circle>
  
  <!-- Smoke particles -->
  <g>
    <!-- Smoke puff 1 -->
    <circle cx="40" cy="40" r="15" fill="url(#smokeGradient1)">
      <animate attributeName="r" values="0;15" dur="0.6s" repeatCount="1" />
      <animate attributeName="cx" values="50;40" dur="0.6s" repeatCount="1" />
      <animate attributeName="cy" values="50;40" dur="0.6s" repeatCount="1" />
      <animate attributeName="opacity" values="0.8;0" dur="1s" repeatCount="1" />
    </circle>
    
    <!-- Smoke puff 2 -->
    <circle cx="60" cy="40" r="12" fill="url(#smokeGradient1)">
      <animate attributeName="r" values="0;12" dur="0.5s" repeatCount="1" />
      <animate attributeName="cx" values="50;60" dur="0.5s" repeatCount="1" />
      <animate attributeName="cy" values="50;40" dur="0.5s" repeatCount="1" />
      <animate attributeName="opacity" values="0.7;0" dur="0.9s" repeatCount="1" />
    </circle>
    
    <!-- Smoke puff 3 -->
    <circle cx="35" cy="55" r="18" fill="url(#smokeGradient1)">
      <animate attributeName="r" values="0;18" dur="0.7s" repeatCount="1" />
      <animate attributeName="cx" values="50;35" dur="0.7s" repeatCount="1" />
      <animate attributeName="cy" values="50;55" dur="0.7s" repeatCount="1" />
      <animate attributeName="opacity" values="0.8;0" dur="1.1s" repeatCount="1" />
    </circle>
    
    <!-- Smoke puff 4 -->
    <circle cx="65" cy="55" r="14" fill="url(#smokeGradient1)">
      <animate attributeName="r" values="0;14" dur="0.6s" repeatCount="1" />
      <animate attributeName="cx" values="50;65" dur="0.6s" repeatCount="1" />
      <animate attributeName="cy" values="50;55" dur="0.6s" repeatCount="1" />
      <animate attributeName="opacity" values="0.7;0" dur="1s" repeatCount="1" />
    </circle>
    
    <!-- Smoke puff 5 - rises higher -->
    <circle cx="50" cy="30" r="10" fill="url(#smokeGradient1)">
      <animate attributeName="r" values="0;10" dur="0.9s" repeatCount="1" />
      <animate attributeName="cy" values="50;30" dur="0.9s" repeatCount="1" />
      <animate attributeName="opacity" values="0.6;0" dur="1.3s" repeatCount="1" />
    </circle>
  </g>
</svg>