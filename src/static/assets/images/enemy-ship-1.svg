<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main body -->
  <path d="M50 10 L30 50 L20 80 L50 70 L80 80 L70 50 L50 10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Wings -->
  <path d="M30 50 L10 60 L20 80 L30 50" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <path d="M70 50 L90 60 L80 80 L70 50" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Cockpit -->
  <circle cx="50" cy="40" r="10" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  
  <!-- Engine glow -->
  <circle cx="50" cy="75" r="5" fill="#f1c40f" stroke="#f39c12" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.7s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Weapon mounts -->
  <rect x="35" y="55" width="5" height="10" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  <rect x="60" y="55" width="5" height="10" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
</svg>