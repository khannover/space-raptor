<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Star pattern -->
    <pattern id="starPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="white" opacity="0.8" />
      <circle cx="30" cy="40" r="1.5" fill="white" opacity="0.7" />
      <circle cx="70" cy="20" r="1" fill="white" opacity="0.9" />
      <circle cx="90" cy="60" r="2" fill="white" opacity="0.8" />
      <circle cx="120" cy="30" r="1" fill="white" opacity="0.7" />
      <circle cx="150" cy="80" r="1.5" fill="white" opacity="0.9" />
      <circle cx="180" cy="120" r="1" fill="white" opacity="0.8" />
      <circle cx="40" cy="100" r="1" fill="white" opacity="0.7" />
      <circle cx="60" cy="150" r="1.5" fill="white" opacity="0.9" />
      <circle cx="100" cy="180" r="1" fill="white" opacity="0.8" />
      <circle cx="140" cy="160" r="2" fill="white" opacity="0.7" />
      <circle cx="170" cy="190" r="1" fill="white" opacity="0.9" />
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="1200" fill="url(#bgGradient)" />
  
  <!-- Stars -->
  <rect width="800" height="1200" fill="url(#starPattern)" />
  
  <!-- Nebula 1 -->
  <ellipse cx="200" cy="300" rx="300" ry="200" fill="#3498db" opacity="0.1" />
  
  <!-- Nebula 2 -->
  <ellipse cx="600" cy="800" rx="250" ry="150" fill="#9b59b6" opacity="0.1" />
  
  <!-- Distant planet -->
  <circle cx="700" cy="200" r="50" fill="#2c3e50" opacity="0.7" />
  <circle cx="700" cy="200" r="48" fill="#34495e" opacity="0.7" />
  
  <!-- Asteroid field -->
  <g opacity="0.5">
    <path d="M100 600 L120 580 L140 590 L130 610 L100 600" fill="#95a5a6" />
    <path d="M150 650 L180 640 L190 660 L160 670 L150 650" fill="#95a5a6" />
    <path d="M300 700 L320 680 L350 690 L340 720 L310 710 L300 700" fill="#95a5a6" />
    <path d="M400 500 L420 490 L430 510 L410 520 L400 500" fill="#95a5a6" />
    <path d="M500 900 L530 880 L550 900 L540 930 L510 920 L500 900" fill="#95a5a6" />
  </g>
</svg>