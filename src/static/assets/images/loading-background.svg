<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="loadingBgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="600" fill="url(#loadingBgGradient)" />
  
  <!-- Game title -->
  <text x="400" y="150" font-family="Arial" font-size="48" font-weight="bold" fill="#e94560" text-anchor="middle">
    RAPTOR: CALL OF THE SHADOWS
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="200" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">
    Clone
  </text>
  
  <!-- Decorative elements -->
  <path d="M100 300 L300 300" stroke="#e94560" stroke-width="3" stroke-dasharray="10,5" />
  <path d="M500 300 L700 300" stroke="#e94560" stroke-width="3" stroke-dasharray="10,5" />
  
  <!-- Small ship silhouette -->
  <path d="M400 350 L380 400 L400 390 L420 400 L400 350" fill="#e94560" />
  
  <!-- Loading text -->
  <text x="400" y="450" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle">
    Loading...
  </text>
</svg>