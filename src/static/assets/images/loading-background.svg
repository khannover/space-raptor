<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="loadingBgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1024" height="768" fill="url(#loadingBgGradient)" />

  <!-- Game title -->
  <text x="512" y="192" font-family="Arial" font-size="48" font-weight="bold" fill="#e94560" text-anchor="middle">
    RAPTOR: CALL OF THE SHADOWS
  </text>

  <!-- Subtitle -->
  <text x="512" y="256" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">
    Clone
  </text>

  <!-- Decorative elements -->
  <path d="M212 384 L412 384" stroke="#e94560" stroke-width="3" stroke-dasharray="10,5" />
  <path d="M612 384 L812 384" stroke="#e94560" stroke-width="3" stroke-dasharray="10,5" />

  <!-- Small ship silhouette -->
