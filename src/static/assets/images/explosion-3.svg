<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Explosion layers -->
  <defs>
    <radialGradient id="explosionGradient1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="explosionGradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f39c12;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Outer explosion -->
  <circle cx="50" cy="50" r="45" fill="url(#explosionGradient1)">
    <animate attributeName="r" values="0;45" dur="0.35s" repeatCount="1" />
    <animate attributeName="opacity" values="1;0" dur="0.55s" repeatCount="1" />
  </circle>
  
  <!-- Inner explosion -->
  <circle cx="50" cy="50" r="30" fill="url(#explosionGradient2)">
    <animate attributeName="r" values="0;30" dur="0.25s" repeatCount="1" />
    <animate attributeName="opacity" values="1;0" dur="0.45s" repeatCount="1" />
  </circle>
  
  <!-- Explosion particles -->
  <g>
    <!-- Ring particle -->
    <circle cx="50" cy="50" r="20" fill="none" stroke="#f1c40f" stroke-width="2">
      <animate attributeName="r" values="0;40" dur="0.5s" repeatCount="1" />
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </circle>
    
    <!-- Particle 1 - Lightning shape -->
    <path d="M50 50 L60 30 L55 40 L65 35 L55 50 L60 55 L50 50" fill="#f1c40f">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 2 - Lightning shape -->
    <path d="M50 50 L70 55 L60 50 L65 40 L50 45 L45 35 L50 50" fill="#f1c40f">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 3 - Lightning shape -->
    <path d="M50 50 L40 70 L45 55 L35 50 L45 45 L40 35 L50 50" fill="#f1c40f">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 4 - Lightning shape -->
    <path d="M50 50 L25 45 L35 50 L30 60 L40 55 L45 65 L50 50" fill="#f1c40f">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 5 -->
    <path d="M50 50 L55 20 L65 25 L50 50" fill="#2ecc71">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 6 -->
    <path d="M50 50 L80 45 L75 55 L50 50" fill="#2ecc71">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 7 -->
    <path d="M50 50 L45 80 L35 75 L50 50" fill="#2ecc71">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 8 -->
    <path d="M50 50 L20 40 L25 30 L50 50" fill="#2ecc71">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
  </g>
</svg>