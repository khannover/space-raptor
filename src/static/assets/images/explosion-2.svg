<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Explosion layers -->
  <defs>
    <radialGradient id="explosionGradient1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="explosionGradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8e44ad;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6c3483;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Outer explosion -->
  <circle cx="50" cy="50" r="45" fill="url(#explosionGradient1)">
    <animate attributeName="r" values="0;45" dur="0.4s" repeatCount="1" />
    <animate attributeName="opacity" values="1;0" dur="0.6s" repeatCount="1" />
  </circle>
  
  <!-- Inner explosion -->
  <circle cx="50" cy="50" r="30" fill="url(#explosionGradient2)">
    <animate attributeName="r" values="0;30" dur="0.3s" repeatCount="1" />
    <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
  </circle>
  
  <!-- Explosion particles -->
  <g>
    <!-- Star-shaped particles -->
    <path d="M50 50 L55 30 L60 50 L80 55 L60 60 L55 80 L50 60 L30 55 Z" fill="#9b59b6">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="30 50 50" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 1 -->
    <path d="M50 50 L65 25 L70 30 L50 50" fill="#3498db">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 2 -->
    <path d="M50 50 L75 50 L70 60 L50 50" fill="#3498db">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 3 -->
    <path d="M50 50 L45 75 L35 70 L50 50" fill="#3498db">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 4 -->
    <path d="M50 50 L25 40 L30 30 L50 50" fill="#3498db">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 5 -->
    <path d="M50 50 L60 15 L70 20 L50 50" fill="#9b59b6">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 6 -->
    <path d="M50 50 L85 40 L80 50 L50 50" fill="#9b59b6">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 7 -->
    <path d="M50 50 L40 85 L30 80 L50 50" fill="#9b59b6">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
    
    <!-- Particle 8 -->
    <path d="M50 50 L15 45 L20 35 L50 50" fill="#9b59b6">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="1" />
    </path>
  </g>
</svg>