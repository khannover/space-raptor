<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Main body -->
  <path d="M60 10 L40 40 L30 90 L60 80 L90 90 L80 40 L60 10" fill="#8e44ad" stroke="#9b59b6" stroke-width="2"/>
  
  <!-- Wings -->
  <path d="M40 40 L10 70 L20 90 L40 40" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  <path d="M80 40 L110 70 L100 90 L80 40" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  
  <!-- Additional wing details -->
  <path d="M40 40 L20 60 L30 70 L40 40" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <path d="M80 40 L100 60 L90 70 L80 40" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  
  <!-- Cockpit -->
  <ellipse cx="60" cy="40" rx="12" ry="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Engine glow -->
  <circle cx="60" cy="85" r="8" fill="#f1c40f" stroke="#f39c12" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Weapon mounts -->
  <rect x="40" y="55" width="6" height="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
  <rect x="74" y="55" width="6" height="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Armor plating -->
  <path d="M50 20 L45 30 L55 30 L50 20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
  <path d="M70 20 L65 30 L75 30 L70 20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
</svg>